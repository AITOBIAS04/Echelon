<title>Echelon — Theatre Detail</title>
<!--
  ═══════════════════════════════════════════════════════════
  MOCK DATA ANNOTATIONS — for engineering team, not UI
  ═══════════════════════════════════════════════════════════
  This is the most important page in the product.
  It is the full trade flow — replaces all inline card trading.

  Mock values pending endpoint confirmation:
  - Real-time price feed (WebSocket /ws/theatre/{id}/price)
  - LMSR price impact curve (GET /api/v1/theatres/{id}/impact?side=yes&amounts=50,100,500,1000)
  - Slippage calculation (server-side, derived from LMSR pool state)
  - Evidence/investigation links (GET /api/v1/theatres/{id}/investigations)
  - Agent activity feed (GET /api/v1/theatres/{id}/agents)

  THEATRE TYPE determines layout variant:
  ├── BINARY     → Yes/No price bars, side selector, line chart
  ├── TEMPORAL   → Bucket selector, probability distribution
  ├── CONTINUOUS → Range selector, percentile band, forecast distribution
  └── COMPOSITE  → Sub-condition breakdown, explanatory only (v1)

  NAVIGATION CONTRACT:
  - From Theatres card "Yes" shortcut → opens with ?side=yes preselected
  - From Theatres card "No" shortcut → opens with ?side=no preselected
  - From Theatres card "View Market →" → opens neutral (no preselection)
  - From Positions table "Open Market →" → opens with existing position shown

  PAGE STATE MACHINE (4 mutually exclusive states):
  if (composite)                → COMPOSITE state (explanatory, no order form)
  else if (settled)             → SETTLED state (archival, no order form)
  else if (paradox || stale)    → ALERT state (warnings, order form with risk context)
  else                          → TRADING state (green, clean execution)

  All elements — header, market context, execution panel, evidence —
  derive from the same pageState variable. No mixing states.

  EXECUTION PANEL RULES:
  - TRADING: Full order form (side selector, size, cost, slippage, CTA)
  - ALERT: Full order form WITH risk warnings above CTA + existing position
  - SETTLED: No order form. Show resolution outcome, certificate, P&L.
  - COMPOSITE: No order form. Show sub-conditions + route to sub-markets.

  RISK & TRUST VOCABULARY (locked from taste.md s11):
  - Paradox: "Healthy" / "Paradox Active"
  - Evidence: "Fresh (Xh)" / "Stale (Xh)"
  - Liquidity: "Healthy" / "Low Liquidity"
  - Verification: "On Track" / "Under Review" / "Disputed"
  - Time: raw value + Urgent (<24h) / Ending Soon (<7d) chips

  EVIDENCE MODULE:
  Single compact card mirroring Investigation card data shape:
  evidence count, claims bar, counter-signals, drift events.
  Same layout regardless of inquiry class — content varies, container stays.

  EXISTING POSITION RULES:
  When user holds a position in this theatre:
  - Show position summary above order form
  - Preview resulting position with explicit text:
    "You hold 300 Yes @ 54¢. This order adds 149 Yes @ 67¢ → new avg 57¢, total 449 shares."
  - If offsetting: "You hold 300 Yes. Buying No reduces net exposure."
  ═══════════════════════════════════════════════════════════
-->

<style>
/* ═══════════════════════════════════════════════════════════
   TASTE TOKENS v1.0
   ═══════════════════════════════════════════════════════════ */
:root {
  --bg-app:oklch(0.965 0.004 265);--bg-card:oklch(0.993 0.001 265);
  --bg-elevated:oklch(1.000 0 0);--bg-sunken:oklch(0.945 0.006 265);
  --bg-hover:oklch(0.935 0.008 265);--bg-active:oklch(0.910 0.010 265);
  --border-primary:oklch(0.875 0.006 265);--border-secondary:oklch(0.920 0.004 265);
  --text-primary:oklch(0.205 0.015 265);--text-secondary:oklch(0.440 0.010 265);
  --text-muted:oklch(0.590 0.008 265);--text-disabled:oklch(0.700 0.005 265);
  --text-inverse:oklch(0.985 0.002 265);
  --purple-50:oklch(0.970 0.018 295);--purple-100:oklch(0.935 0.042 295);
  --purple-200:oklch(0.870 0.085 295);--purple-300:oklch(0.760 0.140 295);
  --purple-400:oklch(0.640 0.195 295);--purple-500:oklch(0.530 0.230 295);
  --purple-600:oklch(0.455 0.215 295);--purple-700:oklch(0.385 0.190 295);
  --green-50:oklch(0.965 0.022 152);--green-100:oklch(0.930 0.050 152);
  --green-200:oklch(0.860 0.095 152);--green-400:oklch(0.640 0.165 152);
  --green-500:oklch(0.545 0.170 152);--green-600:oklch(0.470 0.155 152);
  --green-700:oklch(0.400 0.135 152);
  --orange-50:oklch(0.970 0.022 62);--orange-100:oklch(0.935 0.050 62);
  --orange-200:oklch(0.870 0.095 62);
  --orange-400:oklch(0.690 0.165 62);--orange-500:oklch(0.610 0.185 62);
  --orange-600:oklch(0.540 0.175 62);--orange-700:oklch(0.465 0.155 62);
  --red-50:oklch(0.965 0.020 25);--red-100:oklch(0.930 0.045 25);
  --red-400:oklch(0.640 0.175 25);--red-500:oklch(0.545 0.185 25);
  --red-600:oklch(0.470 0.170 25);
  --status-success:oklch(0.545 0.170 152);--status-warning:oklch(0.540 0.150 85);
  --status-danger:oklch(0.545 0.185 25);--status-info:oklch(0.525 0.155 260);
  --status-paradox:oklch(0.500 0.200 295);
  --shadow-xs:0 1px 2px oklch(0.20 0.01 265/0.04);
  --shadow-sm:0 1px 3px oklch(0.20 0.01 265/0.06),0 1px 2px oklch(0.20 0.01 265/0.03);
  --shadow-md:0 2px 8px oklch(0.20 0.01 265/0.08),0 1px 3px oklch(0.20 0.01 265/0.04);
  --font-sans:'Inter',system-ui,sans-serif;--font-mono:'JetBrains Mono','Fira Code',monospace;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-10:40px;--space-12:48px;
  --sidebar-width:240px;--header-height:56px;
  --radius-sm:6px;--radius-md:8px;--radius-lg:12px;--radius-full:9999px;
  --duration-instant:100ms;--duration-fast:150ms;--duration-normal:200ms;--duration-slow:300ms;
  --ease-out:cubic-bezier(0.16,1,0.3,1);
  --z-sidebar:20;--z-header:30;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);font-size:15px;line-height:24px;color:var(--text-primary);background:var(--bg-app);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border-primary);border-radius:var(--radius-full)}

/* ═══ HEADER (locked) ═══ */
.header{position:fixed;top:0;left:0;right:0;height:var(--header-height);background:var(--bg-card);border-bottom:1px solid var(--border-primary);display:flex;align-items:center;padding:0 var(--space-6);z-index:var(--z-header);box-shadow:var(--shadow-xs)}
.header-left{display:flex;align-items:center;gap:var(--space-4);min-width:calc(var(--sidebar-width) - var(--space-6))}
.header-logo{display:flex;align-items:center;gap:var(--space-2);text-decoration:none;color:var(--text-primary)}
.header-logo-mark{width:28px;height:28px;background:var(--purple-500);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--text-inverse);font-family:var(--font-mono);font-weight:600;font-size:14px}
.header-logo-text{font-weight:700;font-size:17px;letter-spacing:-0.02em}
.header-logo-version{font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--text-muted);background:var(--bg-sunken);padding:1px 6px;border-radius:var(--radius-sm);border:1px solid var(--border-secondary)}
.sidebar-toggle{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;color:var(--text-muted);border-radius:var(--radius-sm);cursor:pointer}
.header-center{flex:1;display:flex;align-items:center;justify-content:center;padding:0 var(--space-8)}
.header-search{width:100%;max-width:480px;position:relative}
.header-search input{width:100%;height:36px;padding:0 var(--space-3) 0 36px;background:var(--bg-sunken);border:1px solid var(--border-secondary);border-radius:var(--radius-md);font-family:var(--font-sans);font-size:13px;color:var(--text-primary);outline:none}
.header-search input::placeholder{color:var(--text-muted)}
.header-search input:focus{border-color:var(--purple-500);box-shadow:0 0 0 2px oklch(0.530 0.230 295/0.12);background:var(--bg-card)}
.header-search-icon{position:absolute;left:var(--space-3);top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}
.header-search-kbd{position:absolute;right:var(--space-2);top:50%;transform:translateY(-50%);font-family:var(--font-mono);font-size:11px;color:var(--text-disabled);background:var(--bg-card);border:1px solid var(--border-secondary);padding:1px 5px;border-radius:4px;line-height:16px}
.header-right{display:flex;align-items:center;gap:var(--space-3)}
.network-pill{display:flex;align-items:center;gap:6px;height:28px;padding:0 var(--space-2) 0 6px;background:var(--bg-sunken);border:1px solid var(--border-secondary);border-radius:var(--radius-full);font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--text-secondary)}
.network-dot{width:8px;height:8px;border-radius:var(--radius-full);background:var(--status-success);box-shadow:0 0 0 2px oklch(0.545 0.170 152/0.20)}
.header-icon-btn{position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border-secondary);background:var(--bg-card);border-radius:var(--radius-md);color:var(--text-secondary);cursor:pointer}
.header-icon-btn:hover{border-color:var(--border-primary);color:var(--text-primary);background:var(--bg-hover)}
.header-badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;background:var(--status-danger);color:var(--text-inverse);font-family:var(--font-mono);font-size:10px;font-weight:600;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg-card)}
.wallet-btn{display:flex;align-items:center;gap:var(--space-2);height:36px;padding:0 var(--space-3);background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border-primary);border-radius:var(--radius-md);font-family:var(--font-sans);font-size:13px;font-weight:600;cursor:pointer}
.wallet-btn:hover{border-color:var(--purple-200);background:var(--bg-hover)}
.wallet-balance{display:flex;align-items:center;gap:var(--space-3)}
.wallet-balance-item{display:flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.wallet-balance-label{font-family:var(--font-sans);font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em}
.wallet-divider{width:1px;height:20px;background:var(--border-primary)}
.wallet-avatar{width:28px;height:28px;border-radius:var(--radius-full);background:linear-gradient(135deg,var(--purple-300),var(--green-400));flex-shrink:0}

/* ═══ SIDEBAR (locked) ═══ */
.sidebar{position:fixed;top:var(--header-height);left:0;bottom:0;width:var(--sidebar-width);background:var(--bg-card);border-right:1px solid var(--border-primary);z-index:var(--z-sidebar);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
.sidebar-content{flex:1;padding:var(--space-3) 0}
.nav-group{margin-bottom:var(--space-1)}.nav-group-label{padding:var(--space-3) var(--space-5) var(--space-1);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:var(--space-3);height:36px;padding:0 var(--space-5);margin:1px var(--space-2);border-radius:var(--radius-sm);color:var(--text-secondary);text-decoration:none;font-size:13px;font-weight:500;cursor:pointer;position:relative;border:none;background:none;width:calc(100% - var(--space-4));text-align:left;white-space:nowrap}
.nav-item:hover{background:var(--bg-hover);color:var(--text-primary)}
.nav-item.active{background:var(--purple-50);color:var(--purple-700);font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 2px 2px 0;background:var(--purple-500)}
.nav-item-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:0.7}
.nav-item.active .nav-item-icon,.nav-item:hover .nav-item-icon{opacity:1}
.nav-item-label{flex:1;overflow:hidden;text-overflow:ellipsis}
.nav-badge{font-family:var(--font-mono);font-size:11px;font-weight:600;min-width:20px;height:20px;padding:0 6px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center}
.nav-badge.count{background:var(--bg-sunken);color:var(--text-muted);border:1px solid var(--border-secondary)}
.nav-badge.alert{background:oklch(0.545 0.185 25/0.10);color:var(--status-danger);border:1px solid oklch(0.545 0.185 25/0.20)}
.nav-badge.live{background:oklch(0.545 0.170 152/0.10);color:var(--status-success);border:1px solid oklch(0.545 0.170 152/0.20)}
.nav-badge.warn{background:oklch(0.540 0.150 85/0.10);color:oklch(0.430 0.130 85);border:1px solid oklch(0.540 0.150 85/0.20)}
.sidebar-footer{border-top:1px solid var(--border-secondary);padding:var(--space-3) var(--space-2)}.sidebar-footer .nav-item{color:var(--text-muted)}

/* ═══════════════════════════════════════════════════════════
   MAIN + PAGE CHROME
   ═══════════════════════════════════════════════════════════ */
.main{margin-left:var(--sidebar-width);margin-top:var(--header-height);min-height:calc(100vh - var(--header-height));padding:var(--space-6)}
.page-breadcrumb{display:flex;align-items:center;gap:var(--space-2);font-size:13px;color:var(--text-muted);margin-bottom:var(--space-2)}
.page-breadcrumb a{color:var(--text-muted);text-decoration:none}.page-breadcrumb a:hover{color:var(--purple-600)}
.page-breadcrumb-sep{color:var(--border-primary)}
.page-breadcrumb-current{color:var(--text-primary);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 var(--space-4);border-radius:var(--radius-md);font-family:var(--font-sans);font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;white-space:nowrap;transition:all var(--duration-fast) ease}
.btn:active{transform:scale(0.97)}
.btn-primary{background:var(--purple-500);color:var(--text-inverse)}.btn-primary:hover{background:var(--purple-400)}
.btn-secondary{background:var(--bg-card);color:var(--text-secondary);border-color:var(--border-primary)}.btn-secondary:hover{background:var(--bg-hover);color:var(--text-primary)}
.btn-ghost{background:transparent;color:var(--text-muted);border-color:transparent}.btn-ghost:hover{color:var(--text-secondary);background:var(--bg-hover)}
.btn-sm{height:28px;padding:0 var(--space-3);font-size:11px;border-radius:var(--radius-sm)}

/* ═══════════════════════════════════════════════════════════
   MARKET HEADER
   ═══════════════════════════════════════════════════════════ */
.market-header{margin-bottom:var(--space-5)}
.market-title{font-size:24px;line-height:32px;font-weight:700;margin-bottom:var(--space-2)}
.market-meta{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}
.market-type-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;padding:2px 8px;border-radius:4px;line-height:16px;color:var(--purple-700);background:var(--purple-50);border:1px solid oklch(0.530 0.230 295/0.15)}
.market-type-badge.composite{color:var(--orange-700);background:var(--orange-50);border-color:oklch(0.610 0.185 62/0.15)}
.market-meta-sep{color:var(--border-primary)}
.market-meta-item{font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:4px}
.market-meta-item strong{font-weight:600;color:var(--text-primary);font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.market-meta-item a{color:var(--purple-600);text-decoration:none;font-weight:600}.market-meta-item a:hover{text-decoration:underline}

/* Status chips — from taste.md s11 */
.chip{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;padding:1px 5px;border-radius:3px;white-space:nowrap;line-height:14px}
.chip-live{color:var(--green-600)}.chip-live::before{content:'';width:5px;height:5px;border-radius:9999px;background:var(--status-success)}
.chip-settled{color:var(--text-muted);background:var(--bg-sunken);border:1px solid var(--border-secondary)}
.chip-paradox{color:var(--status-danger);background:oklch(0.545 0.185 25/0.08);border:1px solid oklch(0.545 0.185 25/0.15)}
.chip-stale{color:oklch(0.430 0.130 85);background:oklch(0.540 0.150 85/0.08);border:1px solid oklch(0.540 0.150 85/0.15)}
.chip-low-liq{color:var(--text-muted);background:var(--bg-sunken);border:1px solid var(--border-secondary)}
.chip-ending-soon{color:var(--orange-600);background:var(--orange-50)}
.chip-urgent{color:var(--status-danger);background:var(--red-50)}

/* ═══════════════════════════════════════════════════════════
   TWO-COLUMN LAYOUT
   ═══════════════════════════════════════════════════════════ */
.detail-layout{display:grid;grid-template-columns:1fr 380px;gap:var(--space-5);align-items:start}

/* ═══════════════════════════════════════════════════════════
   LEFT COLUMN — Market Context
   ═══════════════════════════════════════════════════════════ */
.context-col{display:flex;flex-direction:column;gap:var(--space-4)}

/* Section card */
.section-card{background:var(--bg-card);border:1px solid var(--border-primary);border-radius:var(--radius-md);box-shadow:var(--shadow-xs);overflow:hidden}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) var(--space-5);border-bottom:1px solid var(--border-secondary)}
.section-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted)}
.section-body{padding:var(--space-5)}

/* Market overview */
.market-question{font-size:17px;font-weight:600;line-height:24px;color:var(--text-primary);margin-bottom:var(--space-3)}
.market-resolution{font-size:13px;color:var(--text-secondary);line-height:20px;padding:var(--space-3) var(--space-4);background:var(--bg-sunken);border-radius:var(--radius-sm);border:1px solid var(--border-secondary)}
.market-resolution-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:var(--space-1);display:block}

/* Price display — binary */
.price-display{display:flex;gap:var(--space-3);margin-top:var(--space-5)}
.price-block{flex:1;padding:var(--space-4);border-radius:var(--radius-md);text-align:center}
.price-block.yes-block{background:oklch(0.545 0.170 152/0.04);border:1px solid oklch(0.545 0.170 152/0.15)}
.price-block.no-block{background:oklch(0.545 0.185 25/0.04);border:1px solid oklch(0.545 0.185 25/0.15)}
.price-block-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:var(--space-1)}
.price-block.yes-block .price-block-label{color:var(--green-600)}
.price-block.no-block .price-block-label{color:var(--red-500)}
.price-block-value{font-family:var(--font-mono);font-size:30px;font-weight:700;line-height:36px;font-variant-numeric:tabular-nums}
.price-block.yes-block .price-block-value{color:var(--green-700)}
.price-block.no-block .price-block-value{color:oklch(0.470 0.170 25)}
.price-block-sub{font-size:11px;color:var(--text-muted);margin-top:2px}

/* Price chart placeholder */
.chart-placeholder{height:200px;background:var(--bg-sunken);border-radius:var(--radius-sm);border:1px solid var(--border-secondary);display:flex;align-items:center;justify-content:center;color:var(--text-disabled);font-size:13px;font-weight:500;margin-top:var(--space-4);position:relative;overflow:hidden}
.chart-placeholder::before{content:'';position:absolute;bottom:0;left:0;right:0;height:140px;background:linear-gradient(180deg,transparent 0%,oklch(0.545 0.170 152/0.06) 100%)}
.chart-line{position:absolute;bottom:20px;left:20px;right:20px;top:20px}
.chart-line svg{width:100%;height:100%}

/* ═══════════════════════════════════════════════════════════
   EVIDENCE MODULE — compressed investigation card
   Single card, mirrors investigation card data shape
   ═══════════════════════════════════════════════════════════ */
.evidence-card{background:var(--bg-card);border:1px solid var(--border-primary);border-radius:var(--radius-md);box-shadow:var(--shadow-xs);overflow:hidden}
.evidence-card.archival{opacity:0.7}.evidence-card.archival .section-header{background:var(--bg-sunken)}
.evidence-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--space-2);margin-bottom:var(--space-3)}
.evidence-stats{display:flex;gap:var(--space-5)}
.ev-stat{display:flex;flex-direction:column;gap:1px}
.ev-stat-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted)}
.ev-stat-value{font-family:var(--font-mono);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text-primary);line-height:20px}
.ev-stat-value.warn{color:var(--orange-600)}
.ev-stat-delta{font-family:var(--font-mono);font-size:10px;color:var(--green-600);font-weight:600}
.claims-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:1px;margin-bottom:var(--space-1)}
.claims-seg{height:100%;border-radius:2px}
.claims-seg.supported{background:var(--green-400)}
.claims-seg.partial{background:var(--orange-400)}
.claims-seg.contradicted{background:var(--red-400)}
.claims-seg.unconfirmed{background:var(--border-primary)}
.claims-legend{font-size:11px;color:var(--text-muted);line-height:16px}
.evidence-footer{display:flex;align-items:center;justify-content:space-between;margin-top:var(--space-3);padding-top:var(--space-3);border-top:1px solid var(--border-secondary)}
.evidence-freshness{display:flex;align-items:center;gap:var(--space-2);font-size:12px;color:var(--text-secondary)}
.freshness-dot{width:6px;height:6px;border-radius:var(--radius-full)}
.freshness-dot.fresh{background:var(--green-500)}
.freshness-dot.stale{background:var(--status-warning)}
.evidence-link{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--purple-600);text-decoration:none}.evidence-link:hover{text-decoration:underline}

/* ═══════════════════════════════════════════════════════════
   RISK & TRUST — status dashboard, not description list
   Uses locked vocabulary from taste.md s11
   ═══════════════════════════════════════════════════════════ */
.risk-grid{display:flex;flex-direction:column;gap:0}
.risk-item{display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) 0}
.risk-item + .risk-item{border-top:1px solid var(--border-secondary)}
.risk-item-label{font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:var(--space-2)}
.risk-status{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700}
.risk-status .status-dot{width:7px;height:7px;border-radius:var(--radius-full);flex-shrink:0}
.risk-status.healthy{color:var(--green-600)}.risk-status.healthy .status-dot{background:var(--green-500)}
.risk-status.watch{color:oklch(0.430 0.130 85)}.risk-status.watch .status-dot{background:var(--status-warning)}
.risk-status.danger{color:var(--status-danger)}.risk-status.danger .status-dot{background:var(--status-danger)}
.risk-status.muted{color:var(--text-muted)}.risk-status.muted .status-dot{background:var(--text-disabled)}
.risk-status-sub{font-size:10px;font-weight:500;color:var(--text-disabled);margin-left:4px;font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* Price impact ladder (LMSR AMM — no real order book) */
.impact-table{width:100%;border-collapse:collapse}
.impact-table th{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);padding:0 0 var(--space-2);text-align:left}
.impact-table th:last-child{text-align:right}
.impact-table th.center{text-align:center}
.impact-row{font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums}
.impact-row td{padding:4px 0;border-top:1px solid var(--border-secondary)}
.impact-row td:last-child{text-align:right}
.impact-row td.center{text-align:center}
.impact-size{font-weight:600;color:var(--text-primary)}
.impact-price{font-weight:600}
.impact-price.yes{color:var(--green-600)}
.impact-price.no{color:var(--red-500)}
.impact-slip{color:var(--text-muted);font-size:11px}
.impact-slip.warn{color:var(--orange-600)}
.impact-note{font-size:11px;color:var(--text-disabled);margin-top:var(--space-2);line-height:16px}
.trade-item{display:flex;align-items:center;gap:var(--space-2);padding:4px 0;font-size:12px}
.trade-item + .trade-item{border-top:1px solid var(--border-secondary)}
.trade-side{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;width:28px}
.trade-side.buy{color:var(--green-600)}.trade-side.sell{color:var(--red-500)}
.trade-price{font-family:var(--font-mono);font-weight:600;font-variant-numeric:tabular-nums;color:var(--text-primary)}
.trade-size{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text-secondary);flex:1;text-align:right}
.trade-time{font-family:var(--font-mono);font-size:10px;color:var(--text-disabled);font-variant-numeric:tabular-nums;flex-shrink:0}
.agent-activity-item{display:flex;align-items:center;gap:var(--space-2);padding:4px 0;font-size:12px}
.agent-activity-item + .agent-activity-item{border-top:1px solid var(--border-secondary)}
.agent-name-sm{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--text-primary)}
.agent-action-sm{color:var(--text-secondary);flex:1}
.agent-time-sm{font-family:var(--font-mono);font-size:10px;color:var(--text-disabled);font-variant-numeric:tabular-nums;flex-shrink:0}

/* ═══════════════════════════════════════════════════════════
   RIGHT COLUMN — Execution Panel
   ═══════════════════════════════════════════════════════════ */
.exec-col{position:sticky;top:calc(var(--header-height) + var(--space-6))}
.exec-panel{background:var(--bg-card);border:1px solid var(--border-primary);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);overflow:hidden}
.exec-header{padding:var(--space-4) var(--space-5);border-bottom:1px solid var(--border-secondary);display:flex;align-items:center;justify-content:space-between}
.exec-title{font-size:13px;font-weight:700;color:var(--text-primary)}
.exec-body{padding:var(--space-5)}

/* Side selector */
.side-selector{display:flex;gap:var(--space-2);margin-bottom:var(--space-5)}
.side-btn{flex:1;height:44px;border-radius:var(--radius-md);font-family:var(--font-sans);font-size:15px;font-weight:700;cursor:pointer;border:2px solid transparent;transition:all var(--duration-fast) ease;display:flex;align-items:center;justify-content:center;gap:var(--space-2);background:transparent}
.side-btn:active{transform:scale(0.97)}
.side-btn.yes-btn{color:var(--green-600);border-color:oklch(0.545 0.170 152/0.20);background:oklch(0.545 0.170 152/0.04)}
.side-btn.yes-btn:hover,.side-btn.yes-btn.selected{background:var(--green-500);color:var(--text-inverse);border-color:var(--green-500)}
.side-btn.no-btn{color:var(--red-500);border-color:oklch(0.545 0.185 25/0.20);background:oklch(0.545 0.185 25/0.04)}
.side-btn.no-btn:hover,.side-btn.no-btn.selected{background:var(--red-500);color:var(--text-inverse);border-color:var(--red-500)}
.side-price{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* Form fields */
.form-group{margin-bottom:var(--space-4)}
.form-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:var(--space-1);display:block}
.form-input{width:100%;height:40px;padding:0 var(--space-3);background:var(--bg-card);border:1px solid var(--border-primary);border-radius:var(--radius-md);font-family:var(--font-mono);font-size:15px;font-weight:500;color:var(--text-primary);outline:none;font-variant-numeric:tabular-nums}
.form-input:focus{border-color:var(--purple-500);box-shadow:0 0 0 2px oklch(0.530 0.230 295/0.12)}
.form-input-wrap{position:relative}
.form-input-unit{position:absolute;right:var(--space-3);top:50%;transform:translateY(-50%);font-size:12px;font-weight:600;color:var(--text-muted)}
.form-hint{font-size:11px;color:var(--text-disabled);margin-top:var(--space-1)}

/* Order summary */
.order-summary{background:var(--bg-sunken);border-radius:var(--radius-sm);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-4);border:1px solid var(--border-secondary)}
.order-row{display:flex;align-items:center;justify-content:space-between;padding:3px 0}
.order-row + .order-row{border-top:1px solid var(--border-secondary);padding-top:6px;margin-top:3px}
.order-label{font-size:12px;color:var(--text-secondary)}
.order-value{font-family:var(--font-mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text-primary)}
.order-value.highlight{color:var(--green-600)}
.order-value.warn{color:var(--orange-600)}

/* Execute CTA */
.exec-cta{width:100%;height:48px;border-radius:var(--radius-md);font-family:var(--font-sans);font-size:15px;font-weight:700;cursor:pointer;border:none;display:flex;align-items:center;justify-content:center;gap:var(--space-2);transition:all var(--duration-fast) ease}
.exec-cta:active{transform:scale(0.97)}
.exec-cta.cta-yes{background:var(--green-500);color:var(--text-inverse)}.exec-cta.cta-yes:hover{background:var(--green-400)}
.exec-cta.cta-no{background:var(--red-500);color:var(--text-inverse)}.exec-cta.cta-no:hover{background:var(--red-400)}
.exec-cta.cta-neutral{background:var(--purple-500);color:var(--text-inverse)}.exec-cta.cta-neutral:hover{background:var(--purple-400)}
.exec-cta:disabled{opacity:0.5;cursor:not-allowed;transform:none}

/* Risk warnings in execution panel */
.exec-warnings{display:flex;flex-direction:column;gap:var(--space-2);margin-bottom:var(--space-4)}
.exec-warning{display:flex;align-items:flex-start;gap:var(--space-2);padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);font-size:12px;line-height:16px}
.exec-warning.warn-orange{background:oklch(0.610 0.185 62/0.08);border:1px solid oklch(0.610 0.185 62/0.15);color:var(--orange-700)}
.exec-warning.warn-red{background:oklch(0.545 0.185 25/0.08);border:1px solid oklch(0.545 0.185 25/0.15);color:oklch(0.470 0.170 25)}
.exec-warning-icon{flex-shrink:0;margin-top:1px}

/* Existing position module */
.position-module{background:var(--purple-50);border:1px solid oklch(0.530 0.230 295/0.15);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-4)}
.position-module-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-2)}
.position-module-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--purple-700)}
.position-module-link{font-size:11px;font-weight:600;color:var(--purple-600);text-decoration:none}.position-module-link:hover{text-decoration:underline}
.position-row{display:flex;align-items:center;justify-content:space-between;padding:2px 0}
.position-label{font-size:12px;color:var(--text-secondary)}
.position-value{font-family:var(--font-mono);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text-primary)}
.position-value.positive{color:var(--green-600)}
.position-value.negative{color:var(--red-500)}

/* After-trade preview — explicit additive/offsetting */
.trade-preview{background:var(--bg-sunken);border:1px dashed var(--border-primary);border-radius:var(--radius-sm);padding:var(--space-3);margin-top:var(--space-3)}
.trade-preview-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:var(--space-2)}
.trade-preview-text{font-size:12px;line-height:18px;color:var(--text-secondary)}
.trade-preview-text strong{color:var(--text-primary);font-weight:600}
.trade-preview-text .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:600}

/* Wallet display */
.exec-wallet{display:flex;align-items:center;justify-content:space-between;padding:var(--space-2) 0;margin-top:var(--space-3);border-top:1px solid var(--border-secondary)}
.exec-wallet-label{font-size:11px;color:var(--text-muted)}
.exec-wallet-value{font-family:var(--font-mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text-primary)}

/* ═══════════════════════════════════════════════════════════
   SETTLED STATE — replaces execution panel
   ═══════════════════════════════════════════════════════════ */
.settled-panel{background:var(--bg-card);border:1px solid var(--border-primary);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);overflow:hidden}
.settled-outcome{text-align:center;padding:var(--space-6) var(--space-5)}
.settled-outcome-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:var(--space-2)}
.settled-outcome-value{font-size:24px;font-weight:700;line-height:32px}
.settled-outcome-value.yes{color:var(--green-700)}.settled-outcome-value.no{color:oklch(0.470 0.170 25)}
.settled-cert-link{display:flex;align-items:center;justify-content:center;gap:var(--space-2);margin-top:var(--space-4)}
.settled-cert-link a{font-size:13px;font-weight:600;color:var(--purple-600);text-decoration:none;display:flex;align-items:center;gap:4px}.settled-cert-link a:hover{text-decoration:underline}
.settled-position{padding:var(--space-4) var(--space-5);border-top:1px solid var(--border-secondary)}
.settled-position-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-muted);margin-bottom:var(--space-3)}
.settled-row{display:flex;align-items:center;justify-content:space-between;padding:3px 0}
.settled-row-label{font-size:13px;color:var(--text-secondary)}
.settled-row-value{font-family:var(--font-mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.settled-row-value.positive{color:var(--green-600)}.settled-row-value.negative{color:var(--red-500)}
.settled-payout{text-align:center;padding:var(--space-4) var(--space-5);background:var(--green-50);border-top:1px solid oklch(0.545 0.170 152/0.15)}
.settled-payout-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--green-700);margin-bottom:var(--space-1)}
.settled-payout-value{font-family:var(--font-mono);font-size:24px;font-weight:700;color:var(--green-700);font-variant-numeric:tabular-nums}

/* Archival section treatment */
.section-card.archival{opacity:0.7}.section-card.archival .section-header{background:var(--bg-sunken)}

/* ═══════════════════════════════════════════════════════════
   COMPOSITE STATE — explanatory, no order form
   ═══════════════════════════════════════════════════════════ */
.composite-panel{background:var(--bg-card);border:1px solid var(--border-primary);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);overflow:hidden}
.composite-body{padding:var(--space-5)}
.sub-condition{padding:var(--space-4);border:1px solid var(--border-secondary);border-radius:var(--radius-sm);margin-bottom:var(--space-3)}
.sub-condition:last-child{margin-bottom:0}
.sub-condition-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-2)}
.sub-condition-name{font-size:14px;font-weight:600;color:var(--text-primary)}
.sub-condition-status{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;padding:2px 8px;border-radius:4px}
.sub-condition-status.active{color:var(--green-600);background:var(--green-50)}
.sub-condition-status.pending{color:var(--text-muted);background:var(--bg-sunken)}
.sub-condition-status.resolved{color:var(--purple-700);background:var(--purple-50)}
.sub-condition-price{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.sub-condition-link{font-size:12px;font-weight:600;color:var(--purple-600);text-decoration:none;display:flex;align-items:center;gap:4px;margin-top:var(--space-2)}.sub-condition-link:hover{text-decoration:underline}
.composite-expression{padding:var(--space-4);background:var(--bg-sunken);border:1px solid var(--border-secondary);border-radius:var(--radius-sm);margin-bottom:var(--space-4)}
.composite-expression-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:var(--space-1)}
.composite-expression-value{font-family:var(--font-mono);font-size:15px;font-weight:700;color:var(--text-primary)}
.composite-note{font-size:13px;color:var(--text-secondary);line-height:20px;text-align:center;padding:var(--space-5);border-top:1px solid var(--border-secondary)}
.composite-note strong{color:var(--text-primary)}

/* ═══════════════════════════════════════════════════════════
   STATE TOGGLE (demo)
   ═══════════════════════════════════════════════════════════ */
.state-toggle{position:fixed;bottom:var(--space-5);right:var(--space-5);display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);background:var(--bg-card);border:1px solid var(--border-primary);border-radius:var(--radius-full);box-shadow:var(--shadow-md);font-size:12px;font-weight:600;color:var(--text-secondary);cursor:pointer;z-index:100}
.state-toggle:hover{border-color:var(--purple-200);color:var(--text-primary)}
.state-toggle-dot{width:8px;height:8px;border-radius:var(--radius-full)}

/* ═══════════════════════════════════════════════════════════
   RESPONSIVE
   ═══════════════════════════════════════════════════════════ */
@media(max-width:1280px){.detail-layout{grid-template-columns:1fr 340px}}
@media(max-width:1024px){.sidebar{width:64px}.sidebar .nav-item-label,.sidebar .nav-badge{display:none}.sidebar .nav-group-label{font-size:0;padding:var(--space-2) var(--space-4)}.sidebar .nav-group-label::after{content:'';display:block;width:16px;height:1px;background:var(--border-primary);margin:0 auto}.sidebar .nav-item{padding:0;justify-content:center;margin:1px var(--space-1);width:calc(100% - var(--space-2))}.main{margin-left:64px}.detail-layout{grid-template-columns:1fr}}
@media(max-width:768px){.sidebar{display:none}.main{margin-left:0;padding:var(--space-4)}.detail-layout{grid-template-columns:1fr}.exec-col{position:static}}
</style>
</head>

<nav class="sidebar">

// ── RIGHT COLUMN ──
function renderExecCol(state) {
  const el = document.getElementById('exec-col');

  if (state === 'settled') {
    el.innerHTML = buildSettledPanel();
    return;
  }

  if (state === 'composite') {
    el.innerHTML = buildCompositePanel();
    return;
  }

  // trading or alert
  el.innerHTML = buildExecPanel(state);
}

// ── Fix 3: Execution panel with explicit position preview ──
function buildExecPanel(state) {
  const isAlert = state === 'alert';
  const hasPosition = isAlert;

  // Existing position module
  let positionModule = '';
  if (hasPosition) {
    positionModule = `
      <div class="position-module">
        <div class="position-module-header">
          <span class="position-module-title">Current Position</span>
          <a href="#" class="position-module-link">View in Portfolio</a>

        <div class="position-row"><span class="position-label">Quantity</span><span class="position-value">300 shares</span></div>
        <div class="position-row"><span class="position-label">Avg Entry</span><span class="position-value">54\u00a2</span></div>
        <div class="position-row"><span class="position-label">Current Mark</span><span class="position-value">67\u00a2</span></div>
        <div class="position-row"><span class="position-label">Unrealised P&amp;L</span><span class="position-value positive">+$39.00 (+24.1%)</span></div>
      </div>`;
  }

  // Risk warnings
  let warnings = '';
  if (isAlert) {
    warnings = `
      <div class="exec-warnings">
        <div class="exec-warning warn-red">
          <span class="exec-warning-icon">${iconWarn}</span>
          <span><strong>Paradox Active</strong> \u2014 Conflicting OSINT signals detected. Evidence may be unreliable.</span>
        </div>
        <div class="exec-warning warn-orange">
          <span class="exec-warning-icon">${iconInfo}</span>
          <span><strong>Stale</strong> \u2014 No new evidence for 72 hours.</span>

          <span class="exec-warning-icon">${iconClock}</span>

  // After-trade preview with explicit additive/offsetting text

          You hold <span class="mono">300 Yes @ 54\u00a2</span>. This order <strong>adds</strong> <span class="mono">149 Yes @ 67\u00a2</span> \u2192 new avg <span class="mono">57\u00a2</span>, total <span class="mono">449 shares</span>.
        </div>
      </div>`;
  }

  // Order summary
  let orderSummary = '';
  if (isAlert) {
    orderSummary = `
      <div class="order-summary">
        <div class="order-row"><span class="order-label">Side</span><span class="order-value" style="color:var(--green-600)">Yes</span></div>
        <div class="order-row"><span class="order-label">Price</span><span class="order-value">67\u00a2 / share</span></div>
        <div class="order-row"><span class="order-label">Shares</span><span class="order-value">149</span></div>
        <div class="order-row"><span class="order-label">Cost</span><span class="order-value">$100.00</span></div>
        <div class="order-row"><span class="order-label">Est. Slippage</span><span class="order-value warn">0.4\u00a2 (0.6%)</span></div>
        <div class="order-row"><span class="order-label">Fee</span><span class="order-value">$0.20</span></div>
        <div class="order-row"><span class="order-label">Max Payout</span><span class="order-value highlight">$149.00</span></div>
      </div>`;
  } else {
    orderSummary = `
      <div class="order-summary">
        <div class="order-row"><span class="order-label">Side</span><span class="order-value" style="color:var(--text-muted)">Select a side</span></div>
        <div class="order-row"><span class="order-label">Price</span><span class="order-value" style="color:var(--text-disabled)">\u2014</span></div>
        <div class="order-row"><span class="order-label">Shares</span><span class="order-value" style="color:var(--text-disabled)">\u2014</span></div>
        <div class="order-row"><span class="order-label">Est. Slippage</span><span class="order-value" style="color:var(--text-disabled)">\u2014</span></div>
        <div class="order-row"><span class="order-label">Max Payout</span><span class="order-value" style="color:var(--text-disabled)">\u2014</span></div>
      </div>`;
  }

  return `
  <div class="exec-panel">
    <div class="exec-header">
      <span class="exec-title">Place Order</span>
      <span style="font-size:11px;color:var(--text-muted)">Binary</span>
    </div>
    <div class="exec-body">
      ${positionModule}
      <div class="side-selector">

// ── Side selection (visual demo) ──
function selectSide(side) {
  document.querySelectorAll('.side-btn').forEach(function(b) { b.classList.remove('selected'); });
  document.querySelector(side === 'yes' ? '.yes-btn' : '.no-btn').classList.add('selected');
}

// ── TOGGLE BUTTON ──
function renderToggleButton(state) {
  const dot = document.getElementById('toggle-dot');
  const label = document.getElementById('toggle-label');
  var colors = { trading: 'var(--green-500)', alert: 'var(--orange-500)', settled: 'var(--text-disabled)', composite: 'var(--purple-400)' };
  var labels = { trading: 'Trading (click to cycle)', alert: 'Alert + Position (click to cycle)', settled: 'Settled (click to cycle)', composite: 'Composite (click to cycle)' };
  dot.style.background = colors[state];
  label.textContent = labels[state];
}

function cycleState() {
  stateIdx = (stateIdx + 1) % STATES.length;
  setPageState(STATES[stateIdx]);
}

setPageState(STATES[0]);
</script>
